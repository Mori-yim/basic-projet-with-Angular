<div class="container">
  <h2>Formulaire d'inscription</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <!-- Username -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom d'utilisateur</mat-label>
      <input matInput formControlName="username" placeholder="Ex: morino123">
      <mat-error *ngIf="registerForm.get('username')?.invalid">
        Le nom d'utilisateur doit contenir au moins 4 caractères.
      </mat-error>
    </mat-form-field>

    <!-- Name -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom complet</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Yimfack Morino">
    </mat-form-field>

    <!-- Email -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="Ex: morino@gmail.com">
      <mat-error *ngIf="registerForm.get('email')?.invalid">
        Email invalide.
      </mat-error>
    </mat-form-field>

    <!-- Password -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" formControlName="password">
      <mat-error *ngIf="registerForm.get('password')?.invalid">
        Le mot de passe doit contenir au moins 6 caractères.
      </mat-error>
    </mat-form-field>

    <!-- Téléphone -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Téléphone</mat-label>
      <input matInput type="tel" formControlName="telephone" placeholder="Ex: 699123456">
      <mat-error *ngIf="registerForm.get('telephone')?.invalid">
        Numéro invalide (9 chiffres requis).
      </mat-error>
    </mat-form-field>

    <!-- Rôle -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Rôle</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Préférence -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Préférence</mat-label>
      <mat-select formControlName="preference">
        <mat-option *ngFor="let p of preferences" [value]="p">{{ p }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Bouton -->
    <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
      S'inscrire
    </button>
  </form>
</div>
